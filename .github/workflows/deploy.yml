name: Deploy TARA static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Change these two to move the site. BASE_PATH is "/" for a custom domain or
  # a <user>.github.io site, and "/<repo-name>/" for a project site.
  SITE_DOMAIN: https://taramsv.com
  BASE_PATH: /

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Image derivatives are deterministic for a given source tree, so reuse
      # them across runs and only re-encode what actually changed.
      - name: Restore optimized image cache
        uses: actions/cache@v4
        with:
          path: artifacts/tara-ev/public/images
          key: images-${{ hashFiles('artifacts/tara-ev/assets-src/images/**', 'artifacts/tara-ev/scripts/optimize-assets.mjs') }}
          restore-keys: |
            images-

      - name: Build the data snapshot
        run: pnpm --filter @workspace/tara-ev run fetch-data

      - name: Build static site
        run: pnpm --filter @workspace/tara-ev run build:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/tara-ev/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
