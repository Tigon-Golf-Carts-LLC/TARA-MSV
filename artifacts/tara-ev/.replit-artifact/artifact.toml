kind = "web"
previewPath = "/"
title = "TARA Medium Speed Vehicles"
description = "A full rebuild of the client's site, rebranded as taramsv.com for TARA Medium Speed Vehicles: all pages (home, vehicle series and product pages, accessories, support, news, about, contact, policies) with original images and content, migrated to a modern React site."
version = "1.0.0"
id = "artifacts/tara-ev"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19130

[services.development]
run = "pnpm --filter @workspace/tara-ev run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/tara-ev", "run", "build"]

[services.production.run]
args = ["node", "artifacts/tara-ev/server.mjs"]

[services.production.run.env]
PORT = "19130"
NODE_ENV = "production"

[services.env]
PORT = "19130"
BASE_PATH = "/"
