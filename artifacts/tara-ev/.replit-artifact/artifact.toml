kind = "web"
previewPath = "/"
title = "TARA Medium Speed Vehicles"
description = "A fully static, prerendered TARA Medium Speed Vehicles dealership website that can be hosted on GitHub Pages without a server, runtime API, or database."
version = "1.0.0"
id = "artifacts/tara-ev"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19130

[services.development]
run = "pnpm --filter @workspace/tara-ev run dev"

[services.production]
serve = "static"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/tara-ev", "run", "build"]

[services.env]
PORT = "19130"
BASE_PATH = "/"
SITE_DOMAIN = "https://taramsv.com"